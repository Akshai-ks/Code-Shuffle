{% extends 'base.html' %}

{% block title %}Admin Login — Rotaract Club St. Thomas College{% endblock %}

{% block content %}
<div class="auth-card animate-reveal">
  <div style="padding: 0.5rem 0 1.25rem 0;">
    <img src="{{ url_for('static', filename='images/rotaract-logo.png') }}" alt="Rotaract Official Logo" style="max-width: 100%; max-height: 95px; width: auto; object-fit: contain;">
  </div>

  <h2 style="margin-bottom: 0.25rem; font-size: 1.5rem; color: #0f172a;">Admin Workspace Login</h2>
  <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">Moderation & Management Control</p>

  <form action="{{ url_for('auth.admin_login') }}" method="POST">
    <div class="form-group">
      <label class="form-label" for="email">Admin Email</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="admin@stthomas.edu.in" value="{{ email or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-pink btn-block" style="padding: 0.85rem; font-size: 1.05rem; margin-top: 0.5rem;">
      ADMIN LOGIN
    </button>
  </form>
</div>
{% endblock %}
